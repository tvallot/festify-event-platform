spring.application.name=festify

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/festify}
spring.datasource.username=${DB_USER:festify}
spring.datasource.password=${DB_PASSWORD:festify}
spring.jpa.hibernate.ddl-auto=update

# JWT (secret must be a Base64-encoded key of at least 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS (only needed when the frontend is served from another origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
