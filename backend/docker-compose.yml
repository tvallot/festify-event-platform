services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  festify-app:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  frontend:
      image: nginx:alpine
      ports:
        - "8081:80"
      volumes:
        - ../dist:/usr/share/nginx/html
        - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      restart: always

volumes:
  pgdata: